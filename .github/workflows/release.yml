name: Release crates
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both crates to crates.io after validation
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: crates-io-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release
      - name: Validate release packages and registry state
        if: ${{ !inputs.publish }}
        run: python tools/publish.py
      - name: Publish or resume identical release packages
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python tools/publish.py --publish
      - name: Exclude package staging trees from the build cache
        if: always()
        run: python -c "import shutil; shutil.rmtree('target/package', ignore_errors=True)"
